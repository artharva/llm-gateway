services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gateway']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  mock-provider:
    build:
      context: .
      dockerfile: mock-provider/Dockerfile
    environment:
      MOCK_DELAY_MS: 200
    ports:
      - '4000:4000'

  # Optional local model: docker compose --profile local up
  ollama:
    image: ollama/ollama:latest
    profiles: ['local']
    volumes:
      - ollama:/root/.ollama
    ports:
      - '11434:11434'

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://gateway:gateway@postgres:5432/gateway
      REDIS_URL: redis://redis:6379
      OLLAMA_URL: http://ollama:11434
      MOCK_PRIMARY_URL: http://mock-provider:4000/primary
      MOCK_BACKUP_URL: http://mock-provider:4000/backup
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-provider:
        condition: service_started

volumes:
  pgdata:
  ollama:
