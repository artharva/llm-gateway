server {
  listen 80;
  root /usr/share/nginx/html;

  # The dashboard and the gateway share one origin, so the browser needs no CORS.
  location /admin/ {
    proxy_pass http://gateway:8080;
    proxy_set_header Host $host;
  }
  location = /health {
    proxy_pass http://gateway:8080;
  }

  location / {
    try_files $uri /index.html;
  }
}
